name: Engineering Board validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      # the drawing tools run the team's Python script (decision #46): give CI its packages so the real script is tested too
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pymupdf python-docx openpyxl pillow
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
